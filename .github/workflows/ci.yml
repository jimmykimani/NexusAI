# NexusAI CI/CD

name: NexusAI CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nexusai-backend

jobs:
  # ── Job 1: Lint & Test ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexusai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Alembic migrations (test DB)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nexusai_test
        run: cd backend && alembic upgrade head

      - name: Run unit + integration tests
        env:
          DATABASE_URL: sqlite:///./test.db
          ENVIRONMENT: test
          DISABLE_AUTH: "false"
          # Dummy keys — all external calls are mocked in tests
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          LLM_PROVIDER: groq
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=40

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

  # ── Job 2: Search Quality Evals ─────────────────────────────────
  eval:
    name: Search Quality Evals
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run eval suite
        env:
          DATABASE_URL: sqlite:///./eval.db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_PROVIDER: groq
        run: |
          cd backend
          PYTHONPATH=. python -m pytest tests/eval/ -v --tb=short || true
        # Non-blocking for now — eval infrastructure evolving

  # ── Job 3: Build & Push to ECR ──────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

  # ── Job 4: Deploy Backend to ECS Fargate ────────────────────────
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: http://nexusai-alb-398865142.us-east-1.elb.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster nexusai-cluster \
            --service nexusai-service \
            --force-new-deployment

  # ── Job 5: Deploy Frontend to Amplify ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://master.d2ueqn9r8b4xre.amplifyapp.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Amplify deployment
        run: |
          # Use master as default if ref_name is not set or unexpected
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" = "main" ]; then BRANCH_NAME="master"; fi
          
          echo "Triggering Amplify job for branch: $BRANCH_NAME"
          
          aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name "$BRANCH_NAME" \
            --job-type RELEASE

